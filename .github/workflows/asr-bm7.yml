name: Nhận dạng giọng bm7 (7 video, có và không gợi ý)

on:
  push:
    branches: [claude/cach-ho-cai-tri-tap-1]
    paths: ['ke-hoach/thu-giong-hai/asr_bm7.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            ke-hoach/thu-giong-hai
            phim_ban_do
            assets/thu_giong_hai
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ./.github/actions/cai-dat
        with:
          pip: "faster-whisper numpy"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
      - name: Nhận dạng
        run: |
          read MODEL _ < <(head -1 ke-hoach/thu-giong-hai/asr_bm7.txt)
          for N in $(sed -n 2p ke-hoach/thu-giong-hai/asr_bm7.txt); do
            VD=assets/thu_giong_hai/${N}_chuan
            python phim_ban_do/phude_asr.py ke-hoach/thu-giong-hai/${N}_full.json $VD phim_ban_do/asr_${N}.json ${MODEL:-medium} 1 >> phim_ban_do/asr_log_bm7.txt 2>&1 || echo "LỖI ${N} $?" >> phim_ban_do/asr_log_bm7.txt
            python phim_ban_do/phude_asr.py ke-hoach/thu-giong-hai/${N}_full.json $VD phim_ban_do/asr_${N}.json ${MODEL:-medium} khong_goi_y >> phim_ban_do/asr_log_bm7.txt 2>&1 || echo "LỖI ngoai ${N} $?" >> phim_ban_do/asr_log_bm7.txt
          done
      - name: Lưu kết quả
        run: |
          git config user.email noreply@anthropic.com; git config user.name Claude
          git add phim_ban_do/asr_log_bm7.txt phim_ban_do/asr_*.json 2>/dev/null || true
          git commit -q -m "Nhận dạng giọng bm7" || exit 0
          git push -q || { git pull -q --rebase && git push -q; }
