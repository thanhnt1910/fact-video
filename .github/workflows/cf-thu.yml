name: Cloudflare vẽ thử klein
on:
  workflow_dispatch:
  push:
    branches: [tq4-trang-phuc]
    paths: [cf_thu.trigger]
permissions:
  contents: write
jobs:
  thu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vẽ thử
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python cf_thu_klein.py
      - name: Lưu
        run: |
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/anh_2d/CF_thu
          git commit -q -m "Cloudflare vẽ thử klein [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
