name: Vẽ thử ảnh lt1 (Cloudflare)

# Chỉ chạy khi chủ kênh yêu cầu. Đẩy ke-hoach/chibi/chay_lt1_cf.txt (dòng 1: danh sách số đoạn, cách nhau dấu phẩy).
on:
  push:
    branches: [lh6-dung-thu]
    paths: ['ke-hoach/chibi/chay_lt1_cf.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow
      - name: Vẽ
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
        run: |
          L="$(sed -n 1p ke-hoach/chibi/chay_lt1_cf.txt | tr -d ' \r')"
          python cf_ve_lt1.py "$L" 2>&1 | tee cf_ve_lt1.txt
      - name: Lưu kết quả
        if: always()
        run: |
          mkdir -p logs/chibi
          cp cf_ve_lt1.txt logs/chibi/lt1_cf.txt || true
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f assets/anh_chibi/lt1_cf logs/chibi
          git commit -q -m "Vẽ thử lt1 Cloudflare: kết quả [skip ci]" || echo "không có gì mới"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
