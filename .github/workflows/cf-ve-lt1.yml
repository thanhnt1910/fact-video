name: Vẽ thử ảnh lt1 (Cloudflare)

# Chỉ chạy khi chủ kênh yêu cầu. Đẩy ke-hoach/chibi/chay_lt1_cf.txt (dòng 1: danh sách số đoạn, cách nhau dấu phẩy).
on:
  push:
    branches: [lh6-dung-thu]
    paths: ['ke-hoach/chibi/chay_lt1_cf.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow
      - name: Vẽ theo đợt, mỗi đợt lưu và đẩy ngay
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          mkdir -p logs/chibi
          L="$(sed -n 1p ke-hoach/chibi/chay_lt1_cf.txt | tr -d ' \r')"
          if [ "$L" = "all" ]; then
            L="$(python3 -c "import json;print(','.join(str(i['n']) for i in json.load(open('ke-hoach/chibi/lt1_chibi.json'))))")"
          fi
          echo "$L" | tr ',' '\n' | split -l 16 - dot_
          for f in dot_*; do
            LIST="$(paste -sd, $f)"
            echo "=== Đợt $f: $LIST" | tee -a logs/chibi/lt1_cf.txt
            python cf_ve_lt1.py "$LIST" 2>&1 | tee -a logs/chibi/lt1_cf.txt
            RC=${PIPESTATUS[0]}
            git add -f assets/anh_chibi/lt1_cf logs/chibi
            git commit -q -m "Vẽ lt1 Cloudflare: đợt $f [skip ci]" || true
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
            [ "$RC" = "3" ] && { echo "Hết lượt, dừng."; break; }
          done
