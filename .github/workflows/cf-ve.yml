name: Cloudflare vẽ ảnh
on:
  workflow_dispatch:
  push:
    branches: [tq4-trang-phuc]
    paths: [cf_job.json]
permissions:
  contents: write
jobs:
  thu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vẽ thử
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
        run: python cf_ve.py
      - name: Lưu
        run: |
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/anh_2d/CF_*
          git commit -q -m "Cloudflare vẽ ảnh [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
