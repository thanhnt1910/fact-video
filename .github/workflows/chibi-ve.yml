name: Vẽ ảnh chibi hàng loạt (FLUX + LoRA, Kaggle)

# Chỉ chạy khi chủ kênh yêu cầu. Chạy lần lượt các kernel Kaggle, không chạy song song với lần vẽ khác.
# Kích hoạt bằng cách đẩy ke-hoach/chibi/chay_lt1.txt trên nhánh lh6-dung-thu:
#   dòng 1: "chay" (vẽ) hoặc "chi_tai" (chỉ tải lại kết quả);
#   dòng 2 (tùy chọn): danh sách số đoạn cần vẽ lại, cách nhau dấu phẩy;
#   dòng 3 (tùy chọn): dot=N để đổi hạt giống khi vẽ lại.
on:
  push:
    branches: [lh6-dung-thu]
    paths: ['ke-hoach/chibi/chay_lt1.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chibi:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow numpy requests kaggle
      - name: Vẽ chibi trên Kaggle
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          F=ke-hoach/chibi/chay_lt1.txt
          ARGS="lt1"
          [ "$(sed -n 1p $F)" = "chi_tai" ] && ARGS="$ARGS chi_tai_lai=1"
          L2="$(sed -n 2p $F | tr -d ' \r')"
          [ -n "$L2" ] && ARGS="$ARGS chi_ve=$L2"
          L3="$(sed -n 3p $F | tr -d ' \r')"
          [ -n "$L3" ] && ARGS="$ARGS $L3"
          echo "Lệnh: python kaggle_chibi_ve.py $ARGS"
          python kaggle_chibi_ve.py $ARGS 2>&1 | tee chibi_ve_chay.txt
      - name: Lưu kết quả
        if: always()
        run: |
          mkdir -p logs/chibi
          cp chibi_ve_chay.txt logs/chibi/lt1_ve_chay.txt || true
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f assets/anh_chibi logs/chibi
          git commit -q -m "Vẽ chibi lt1: kết quả [skip ci]" || echo "không có gì mới"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
