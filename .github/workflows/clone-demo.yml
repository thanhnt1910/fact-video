name: So sánh giọng nhân bản

on:
  workflow_dispatch:
    inputs:
      voices:
        description: "Giọng Gemini làm mẫu (để trống = Sadaltager)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Bộ nhớ đệm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
            .venv-tts
          key: fv-cache-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: fv-cache-v1-
      - name: Cài đặt
        run: |
          python -m pip install -q numpy
          if ! .venv-tts/bin/python -c "import sys" 2>/dev/null; then rm -rf .venv-tts; python -m venv .venv-tts; fi
          .venv-tts/bin/python -m pip install -q vieneu
      - name: Tạo file nghe thử
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: mkdir -p demo logs && rm -f demo/list.txt && python demo_clone.py "${{ inputs.voices }}" 2>&1 | tee logs/clone-demo.txt
      - name: Gửi Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -f telegram_chat_id.txt ] || exit 0
          CHAT=$(cat telegram_chat_id.txt)
          curl -s -o /dev/null -F chat_id="$CHAT" -F text="🎧 So sánh giọng (đoạn đầu chuyện 1518): 1 = Gemini gốc, 2 = VieNeu nhân bản theo mẫu Gemini (miễn phí), 3 = VieNeu đang dùng" "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          while IFS='|' read -r name file; do
            [ -z "$file" ] && continue
            curl -s -o /dev/null -w "$name: %{http_code}\n" -F chat_id="$CHAT" -F audio=@"demo/$file" \
              -F title="$name" -F performer="Người Gác Sử" -F caption="$name" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendAudio"
          done < demo/list.txt
      - name: Lưu file nghe thử vào repo
        run: |
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/ giong-mau/*-ref.wav logs/clone-demo.txt
          git commit -q -m "So sánh giọng nhân bản" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
