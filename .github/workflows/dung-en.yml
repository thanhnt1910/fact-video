name: Dựng video dài tiếng Anh (History Mysteries Daily)

on:
  push:
    branches: [demo-giong-en]
    paths: ['ke-hoach/*/chay.txt']
  workflow_dispatch:
    inputs:
      buoc:
        description: "Các bước, cách nhau dấu phẩy: tai-anh, giong, dung, dung-thu (để trống = đọc chay.txt của chủ đề)"
        required: false
        default: ""
      chu_de:
        description: "Thư mục chủ đề trong ke-hoach (roanoke, andree...)"
        required: false
        default: "roanoke"

permissions:
  contents: write

concurrency:
  group: dung-en
  cancel-in-progress: false

jobs:
  dung:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Xác định chủ đề
        run: |
          CD="${{ inputs.chu_de }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            CD=$(git diff --name-only HEAD~1 HEAD | grep -E '^ke-hoach/[^/]+/chay.txt$' | head -1 | cut -d/ -f2)
          fi
          [ -n "$CD" ] || CD=roanoke
          J="ke-hoach/$CD/$CD.json"
          ID=$(python3 -c "import json;print(json.load(open('$J'))['id'])")
          echo "CD=$CD" >> $GITHUB_ENV; echo "J=$J" >> $GITHUB_ENV; echo "ID=$ID" >> $GITHUB_ENV
          echo "Chủ đề: $CD ($ID)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài đặt
        run: |
          python -m pip install -q numpy pillow requests imageio-ffmpeg
          which ffmpeg || { sudo apt-get install -y -qq ffmpeg > /dev/null; }
          fc-list | grep -qi "DejaVu Sans" || sudo apt-get install -y -qq fonts-dejavu-core > /dev/null
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q " ass " && echo "ffmpeg có bộ lọc ass" || echo "CẢNH BÁO: ffmpeg thiếu ass"
      - name: Bộ nhớ đệm giọng
        uses: actions/cache/restore@v4
        with:
          path: assets/tts_cache
          key: fv-en-tts-${{ github.run_id }}
          restore-keys: fv-en-tts-
      - name: Chạy các bước
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          BUOC_IN: ${{ inputs.buoc }}
        run: |
          mkdir -p logs
          BUOC="$BUOC_IN"
          [ -z "$BUOC" ] && BUOC=$(tr -d ' \r\n' < ke-hoach/$CD/chay.txt)
          echo "Các bước: $BUOC"
          set -o pipefail
          for b in ${BUOC//,/ }; do
            python en_video.py "$b" "$J" 2>&1 | tee -a logs/dung-en.txt || { echo "⛔ Dừng ở bước $b"; exit 1; }
          done
      - name: Lưu bộ nhớ đệm giọng
        if: always()
        uses: actions/cache/save@v4
        with:
          path: assets/tts_cache
          key: fv-en-tts-${{ github.run_id }}
      - name: Đưa video lên Releases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for kind in dai thu; do
            f=output/$ID/${ID}_$kind.mp4
            [ -f "$f" ] || continue
            tag=video-$ID; [ $kind = thu ] && tag=video-$ID-khong-giong
            extra=""; for x in output/$ID/${ID}_${kind}_xem_nhanh.mp4 output/$ID/${ID}_xem_nhanh.mp4 output/$ID/$ID.en.srt output/$ID/chuong.txt output/$ID/bao_cao.json; do [ -f "$x" ] && extra="$extra $x"; done
            gh release delete $tag -y --cleanup-tag 2>/dev/null || true
            gh release create $tag -t "$ID ($kind)" -n "Bản dựng thử" "$f" $extra
          done
      - name: Gửi Telegram (bản xem nhanh)
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          for f in output/$ID/${ID}_xem_nhanh.mp4 output/$ID/${ID}_thu_xem_nhanh.mp4; do
            [ -n "$TG_TOKEN" ] && [ -f telegram_chat_id.txt ] && [ -f "$f" ] || continue
            sz=$(stat -c %s "$f"); [ "$sz" -lt 49000000 ] || continue
            curl -s -o /dev/null -F chat_id="$(cat telegram_chat_id.txt)" -F video=@"$f" -F caption="$ID - $(basename $f)" "https://api.telegram.org/bot${TG_TOKEN}/sendVideo"
          done
      - name: Lưu vào repo
        if: always()
        run: |
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/anh_en logs/dung-en.txt output/$ID/$ID.en.srt output/$ID/chuong.txt output/$ID/bao_cao.json output/$ID/khung_mau 2>/dev/null || true
          git commit -q -m "Dựng $ID [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
