name: Nghe thử giọng Gemini

on:
  workflow_dispatch:
    inputs:
      voices:
        description: "Danh sách giọng Gemini (vd: Sulafat,Aoede,Kore). Để trống = mặc định"
        required: false
        default: ""
      video:
        description: "Mã video khoa học (vd: cavendish). Để trống = video 1"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài đặt
        run: |
          command -v ffmpeg >/dev/null 2>&1 || { timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg > /dev/null; } || echo "apt lỗi hoặc quá hạn"
          python -m pip install -q numpy
      - name: Tạo file nghe thử
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI_API_KEY_21 }}
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          mkdir -p demo logs
          rm -f demo/list.txt
          set -o pipefail
          python demo_gemini.py "${{ inputs.voices }}" "${{ inputs.video }}" 2>&1 | tee logs/gemini-demo.txt
      - name: Gửi Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -f telegram_chat_id.txt ] && [ -s demo/list.txt ] || exit 0
          CHAT=$(cat telegram_chat_id.txt)
          curl -s -o /dev/null -F chat_id="$CHAT" -F text="🎧 Nghe thử giọng Gemini TTS:" "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          while IFS='|' read -r name file || [ -n "$file" ]; do
            [ -z "$file" ] && continue
            curl -s -o /dev/null -F chat_id="$CHAT" -F audio=@"demo/$file" -F title="$name" \
              -F performer="Người Gác Sử" "https://api.telegram.org/bot${TG_TOKEN}/sendAudio"
          done < demo/list.txt
      - name: Lưu vào repo
        if: always()
        run: |
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/ logs/gemini-demo.txt || true
          git commit -q -m "Nghe thử giọng Gemini" || exit 0
          git pull --rebase -q || true
          git push -q
