name: Kiểm tra Gemini

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra khóa Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 gemini_kiemtra.py
      - name: Lưu kết quả
        if: always()
        run: |
          git add logs/gemini_kiemtra.txt || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -q -m "Kiểm tra Gemini [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
