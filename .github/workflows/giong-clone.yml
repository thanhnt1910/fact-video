name: Nhân bản giọng (F5-TTS, Kaggle)

# Chỉ chạy khi chủ kênh yêu cầu. Đẩy ke-hoach/thu-giong-hai/giong_clone.txt trên nhánh lh6-dung-thu:
# dòng 1 = đường dẫn kịch bản json, dòng 2 = thư mục ra, dòng 3 (tùy chọn) = số đoạn tối đa hoặc "chi_tai".
on:
  push:
    branches: [lh6-dung-thu]
    paths: ['ke-hoach/thu-giong-hai/giong_clone.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow numpy requests kaggle six python-slugify tqdm urllib3 certifi python-dateutil protobuf bleach webencodings text-unidecode
      - run: sudo apt-get install -y -q ffmpeg || true
      - name: Chạy trên Kaggle
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          F=ke-hoach/thu-giong-hai/giong_clone.txt
          KB=$(sed -n 1p $F); OUT=$(sed -n 2p $F); X=$(sed -n 3p $F)
          if [ "$X" = "chi_tai" ]; then EXTRA="chi_tai_lai=1"; elif [ -n "$X" ]; then EXTRA="gioi_han=$X"; else EXTRA=""; fi
          python kaggle_giong.py "$KB" "$OUT" $EXTRA 2>&1 | tee giong_chay.txt
      - name: Lưu kết quả
        if: always()
        run: |
          F=ke-hoach/thu-giong-hai/giong_clone.txt; OUT=$(sed -n 2p $F)
          cp giong_chay.txt "$OUT/chay.txt" 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "noreply@anthropic.com"
          git add -f "$OUT" || true
          git commit -q -m "Nhân bản giọng: kết quả [skip ci]" || echo "không có gì mới"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
