name: Gửi tệp (ảnh, video) lên Telegram

on:
  push:
    paths:
      - "ke-hoach/thu-giong-hai/gui_tg.txt"

permissions:
  contents: read

jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gửi
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILES_FILE: ke-hoach/thu-giong-hai/gui_tg.txt
          CAP: ""
        run: |
          [ -z "$TG_CHAT" ] && TG_CHAT=$(cat telegram_chat_id.txt)
          fail=0
          FILES=$(tail -n +2 "$FILES_FILE" | tr "\n" " ")
          for f in $FILES; do
            case "$f" in
              *.mp4) m=sendVideo; k=video; extra="-F supports_streaming=true" ;;
              *) m=sendDocument; k=document; extra="" ;;
            esac
            C="${CAP:-$(basename $f)}"
            if [ "$k" = video ] && [ -f ke-hoach/thu-giong-hai/gui_tg_cap.txt ]; then C="$(head -c 1000 ke-hoach/thu-giong-hai/gui_tg_cap.txt)"; fi
            code=$(curl -s -o r.txt -w "%{http_code}" -F chat_id="$TG_CHAT" -F "$k=@$f" -F caption="$C" $extra "https://api.telegram.org/bot${TG_TOKEN}/$m")
            echo "$f -> $code"; [ "$code" = 200 ] || { fail=1; head -c 300 r.txt; }
          done
          exit $fail
