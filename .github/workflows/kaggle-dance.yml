name: Video người nhảy (Kaggle, miễn phí)

# Chỉ chạy khi bấm tay (workflow_dispatch). Không có push/schedule, không commit gì vào repo.
# Bước 1 "gui": cắt video mẫu, đẩy lên Kaggle rồi thoát (Kaggle chạy nền vài giờ).
# Bước 2 "lay": xem Kaggle xong chưa, xong thì tải về, ghép, gắn nhạc; video nằm ở mục Artifacts của lần chạy.
# Ảnh nhân vật và video nhảy mẫu phải được đưa vào repo trước (vd: dance_in/abc/anh.jpg, dance_in/abc/mau.mp4).
# Không chạy cùng lúc với workflow Kaggle khác (vẽ ảnh, tranh thành video).

on:
  # Kích hoạt kiểu của repo: đẩy file dance_in/demo/chay.txt lên nhánh này (không cần có workflow trên main).
  push:
    branches: [them-video-nhay-kaggle]
    paths: ['dance_in/demo/chay.txt']
  workflow_dispatch:
    inputs:
      buoc:
        description: "gui = gửi lên Kaggle; lay = lấy kết quả về; tatca = gửi rồi chờ và lấy về"
        type: choice
        options: [gui, lay, tatca]
        default: gui
      ten:
        description: "Tên video (chữ không dấu, không khoảng trắng, vd: abc)"
        required: true
      anh:
        description: "Đường dẫn ảnh nhân vật trong repo (bước gui)"
        required: false
        default: ""
      mau:
        description: "Đường dẫn video nhảy mẫu trong repo (cả hai bước; bước lay dùng để lấy nhạc)"
        required: false
        default: ""
      tong:
        description: "Tổng độ dài giây (bước gui)"
        required: false
        default: "30"
      doan:
        description: "Độ dài mỗi đoạn giây (bước gui)"
        required: false
        default: "10"
      bat_dau:
        description: "Bắt đầu cắt video mẫu từ giây thứ mấy (bước gui)"
        required: false
        default: "0"
      thu:
        description: "Chỉ thử 3 giây (bước gui), nên bật ở lần đầu"
        type: boolean
        default: true
      cho:
        description: "Bước lay: số phút chờ Kaggle xong (0 = xem một lần)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: kaggle-dance
  cancel-in-progress: false

jobs:
  dance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài FFmpeg và thư viện
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          python -m pip install -q pillow kaggle
      - name: Chạy
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BUOC: ${{ inputs.buoc }}
          TEN: ${{ inputs.ten }}
          ANH: ${{ inputs.anh }}
          MAU: ${{ inputs.mau }}
          TONG: ${{ inputs.tong }}
          DOAN: ${{ inputs.doan }}
          BAT_DAU: ${{ inputs.bat_dau }}
          THU: ${{ inputs.thu }}
          CHO: ${{ inputs.cho }}
          SU_KIEN: ${{ github.event_name }}
        run: |
          set -eo pipefail
          mkdir -p logs/kaggle_dance
          exec > >(tee logs/kaggle_dance/chay_log.txt) 2>&1
          if [ "$SU_KIEN" = "push" ]; then set -a; . dance_in/demo/chay.txt; set +a; fi
          if [ "$BUOC" = "gui" ] || [ "$BUOC" = "tatca" ]; then
            EXTRA=""
            if [ "$THU" = "true" ]; then EXTRA="--thu"; fi
            python kaggle_dance.py gui --ten "$TEN" --anh "$ANH" --mau "$MAU" --tong "$TONG" --doan "$DOAN" --bat-dau "$BAT_DAU" $EXTRA
          fi
          if [ "$BUOC" = "tatca" ]; then sleep 180; fi   # đợi Kaggle bắt đầu chạy bản mới trước khi xem trạng thái
          if [ "$BUOC" = "lay" ] || [ "$BUOC" = "tatca" ]; then
            python kaggle_dance.py lay --ten "$TEN" --mau "$MAU" --cho "$CHO"
          fi
      - name: Lưu nhật ký vào nhánh
        if: always()
        run: |
          git add -f logs/kaggle_dance/*.txt || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -q -m "Nhật ký video nhảy [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
      - name: Video và nhật ký
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-nhay-${{ inputs.ten || github.run_id }}
          path: |
            output/dance/*.mp4
            logs/kaggle_dance/*
          if-no-files-found: ignore
          retention-days: 1   # repo public nên cho video tự xóa sau 1 ngày; tải về ngay
