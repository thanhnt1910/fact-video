name: Ảnh 2D thành clip chuyển động (Kaggle, miễn phí)

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã tập (có assets/anh_2d/<mã> và ke-hoach/nhan-vat/<mã>_dong.json)"
        required: true
        default: "TQ2"
      anh:
        description: "Số ảnh cần làm clip, cách nhau dấu phẩy, tối đa 12 (vd: 003,041,050)"
        required: true
        default: "003,041,050"

permissions:
  contents: write

jobs:
  dong:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow numpy requests kaggle
      - name: Chạy Wan 2.2 trên Kaggle
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kaggle_animate_2d.py "${{ inputs.ma }}" "${{ inputs.anh }}"
      - name: Lưu clip vào kho
        if: always()
        run: |
          git add -f assets/clips_2d logs/kaggle_video || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -q -m "Clip chuyển động ${{ inputs.ma }} (Kaggle) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && git push -q && exit 0; sleep 5; done
          exit 1
