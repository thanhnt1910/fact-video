name: Thử ảnh thành video (LTX-Video, Kaggle)

# Chạy khi đẩy ke-hoach/thu-giong-hai/i2v_chay.txt trên nhánh thu-giong-hai.
# Dòng đầu: "<mã> <số ảnh cách nhau dấu phẩy>", ví dụ: LH5Q 020,029,024
on:
  push:
    branches: [thu-giong-hai]
    paths: ['ke-hoach/thu-giong-hai/i2v_chay.txt']

permissions:
  contents: write

jobs:
  thu:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow kaggle
      - name: Chạy LTX-Video trên Kaggle
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u kaggle_i2v_thu.py $(head -1 ke-hoach/thu-giong-hai/i2v_chay.txt) 2>&1 | tee /tmp/i2v.txt
      - name: Lưu kết quả
        if: always()
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -f logs/kaggle_i2v 2>/dev/null || true
          git commit -q -m "Thử LTX-Video [skip ci]" || exit 0
          for k in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 8 + 2)); done
