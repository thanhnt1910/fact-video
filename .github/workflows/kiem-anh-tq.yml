name: Gemini xem ảnh Tam Quốc

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã (vd TQ45); ảnh ở assets/anh_2d/CF_<mã>/<key>_a.jpg"
        required: true
        default: "TQ45"
      suffix:
        description: "Hậu tố biến thể ảnh (vd _a)"
        required: false
        default: "_a"
      only:
        description: "Chỉ kiểm tra các ảnh này (vd 007,031); để trống = tất cả"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow numpy requests opencv-python-headless
      - name: Gemini xem từng ảnh
        shell: bash
        env:
          REVIEW_MODELS: "gemini-3.8-flash,gemini-flash-latest,gemini-2.5-flash"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set +e
          ARGS="${{ inputs.ma }} suffix=${{ inputs.suffix }}"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS only=${{ inputs.only }}"
          python kiem_tra_tq.py $ARGS 2>&1 | tee /tmp/ktq.txt
      - name: Lưu kết quả
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p logs/kiem_2d; cp /tmp/ktq.txt logs/kiem_2d/${{ inputs.ma }}_tq_chay.txt
          git config user.name "fact-video-bot"; git config user.email "actions@users.noreply.github.com"
          git add -f logs/kiem_2d
          git commit -q -m "Gemini xem ảnh Tam Quốc ${{ inputs.ma }} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
