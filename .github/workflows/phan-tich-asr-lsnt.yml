name: Nhận dạng lời video mẫu LSNT
# Chỉ chạy khi chủ kênh yêu cầu (đẩy assets/phan_tich/lsnt/chay.txt)
on:
  push:
    branches: [lh6-dung-thu]
    paths: ['assets/phan_tich/lsnt/chay.txt']
permissions:
  contents: write
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ./.github/actions/cai-dat
        with:
          pip: "faster-whisper numpy"
      - name: Nhận dạng
        run: python phan_tich_asr_lsnt.py > assets/phan_tich/lsnt/log.txt 2>&1 || echo "LỖI $?" >> assets/phan_tich/lsnt/log.txt
      - name: Lưu
        if: always()
        run: |
          git config user.email noreply@anthropic.com; git config user.name Claude
          git add -f assets/phan_tich/lsnt
          git commit -q -m "Nhận dạng video mẫu LSNT [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
