name: Phát hành video lên Releases

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã video (vd CD1); lấy file trong phat-hanh/<mã>/"
        required: true
      tieu_de:
        description: "Tiêu đề release"
        required: true

permissions:
  contents: write

jobs:
  phat-hanh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tạo release và tải file lên
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="video-${{ inputs.ma }}"
          d="phat-hanh/${{ inputs.ma }}"
          notes="$d/ghi_chu.md"; [ -f "$notes" ] || notes=/dev/null
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "${{ inputs.tieu_de }}" --notes-file "$notes" < /dev/null
          gh release edit "$tag" --title "${{ inputs.tieu_de }}" --notes-file "$notes"
          files=$(ls $d/* | grep -v ghi_chu.md)
          gh release upload "$tag" $files --clobber < /dev/null
