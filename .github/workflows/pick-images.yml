name: Duyệt ảnh ứng viên

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Mã kịch bản (vd: DV1,CD-F1). Để trống = tất cả"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài đặt
        run: |
          python -m pip install -q pillow numpy
          sudo apt-get install -y -qq fonts-dejavu-core > /dev/null || true
      - name: Tìm và ghép ảnh ứng viên
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python images.py "${{ inputs.only }}"
      - name: Lưu vào repo
        run: |
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logs/cand_* || true
          git commit -q -m "Ảnh ứng viên để duyệt" || exit 0
          git pull --rebase -q || true
          git push -q
