name: Dựng video

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
  schedule:
    - cron: "17 0 * * *"   # 7h17 sáng VN: thử lại video dài bị hoãn (ví dụ Gemini hết lượt hôm trước)
  workflow_dispatch:
    inputs:
      only:
        description: "Chỉ dựng các mã này (vd: SL1 = cả bộ; SL1:ngan = video ngắn + bài ảnh; SL1:dai = video dài)"
        required: false
        default: ""
      nguon_ve:
        description: "Nguồn vẽ tranh AI: để trống = Cloudflare trước, hết lượt thì sang Kaggle; kaggle = chỉ dùng Kaggle"
        required: false
        default: ""
      send:
        description: "Gửi Telegram ngay (yes) hay giữ lại chờ duyệt (no)"
        required: false
        default: "no"
      bo_qua_kiemtra:
        description: "Bỏ qua kiểm tra kịch bản và ảnh trước khi dựng (yes nếu chắc chắn lỗi báo ra không đúng)"
        required: false
        default: "no"
      hau_to:
        description: "Hậu tố tên bản trên Releases khi dựng thử (vd: -thu → video-ST1-thu), để không ghi đè bản cũ"
        required: false
        default: ""
      all:
        description: "Dựng lại tất cả"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Phông emoji và ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg > /dev/null

      - name: Bộ nhớ đệm (mô hình giọng, trình duyệt, thư viện)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fact-video
            ~/.cache/ms-playwright
            ~/.cache/pip
            .venv-tts
          key: fv-cache-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: fv-cache-v1-

      - name: Bộ nhớ đệm nhạc nền
        uses: actions/cache@v4
        with:
          path: assets/music/cache
          key: fv-music-${{ hashFiles('assets/music/library.json') }}
          restore-keys: fv-music-

      - name: Bộ nhớ đệm giọng Gemini và ảnh AI
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/tts_cache
            assets/ai_cache
          key: fv-gen-${{ github.run_id }}
          restore-keys: fv-gen-

      - name: Cài thư viện dựng video
        run: |
          python -m pip install -q -r requirements.txt kaggle
          python -m playwright install --with-deps chromium > /dev/null

      - name: Cài giọng đọc VieNeu-TTS
        run: |
          if ! .venv-tts/bin/python -c "import sys" 2>/dev/null; then
            rm -rf .venv-tts
            python -m venv .venv-tts
          fi
          .venv-tts/bin/python -m pip install -q --upgrade pip
          .venv-tts/bin/python -m pip install -q vieneu

      - name: Dựng video
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AI_SOURCE: ${{ inputs.nguon_ve }}
          FV_SKIP_PRECHECK: ${{ inputs.bo_qua_kiemtra }}
          FV_IMG_STRICT: ${{ inputs.bo_qua_kiemtra == 'yes' && '0' || '1' }}
        run: |
          set -o pipefail
          mkdir -p logs
          if [ "${{ inputs.all }}" = "true" ]; then ARGS="--all"
          elif [ -n "${{ inputs.only }}" ]; then ARGS="--only ${{ inputs.only }}"
          else ARGS=""; fi
          python ci_render.py $ARGS 2>&1 | tee logs/last-run.log

      - name: Tự kiểm tra kỹ thuật (miễn phí)
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          HAU_TO: ${{ inputs.hau_to }}
        run: |
          touch ci_outputs.txt ci_long.txt
          # chỉ kiểm tra kỹ thuật miễn phí (ffmpeg); không gửi video/khung hình cho Gemini xem lại nữa
          python review.py --ci --no-ai 2>&1 | tee logs/review-run.log || true

      - name: Ảnh xem nhanh (để kiểm tra)
        if: always()
        run: |
          mkdir -p logs
          rm -f logs/preview_*.jpg
          touch ci_outputs.txt ci_long.txt
          while read -r id || [ -n "$id" ]; do
            [ -z "$id" ] && continue
            f="output/$id/$id.mp4"; [ -f "$f" ] || continue
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" < /dev/null)
            ffmpeg -nostdin -loglevel error -y -i "$f" -vf "fps=6/${dur%.*},scale=270:-1,tile=6x1" -frames:v 1 "logs/preview_${id}.jpg" || true
            cp "output/$id/${id}_caption.txt" "logs/caption_${id}.txt" 2>/dev/null || true
            cp "output/$id/${id}_review.jpg" "logs/review_${id}.jpg" 2>/dev/null || true
            if [ -f "output/$id/${id}_post_1.jpg" ]; then
              cp "output/$id/${id}_post.txt" "logs/post_${id}.txt" 2>/dev/null || true
              n=$(ls output/$id/${id}_post_*.jpg | wc -l)
              ffmpeg -nostdin -loglevel error -y -i "output/$id/${id}_post_%d.jpg" -vf "scale=324:-1,tile=${n}x1" -frames:v 1 "logs/post_${id}.jpg" || true
            fi
          done < ci_outputs.txt
          [ -s ci_long.txt ] || exit 0
          while read -r id || [ -n "$id" ]; do
            [ -z "$id" ] && continue
            f="output/$id/${id}_dai.mp4"; [ -f "$f" ] || continue
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" < /dev/null)
            ffmpeg -nostdin -loglevel error -y -i "$f" -vf "fps=8/${dur%.*},scale=320:-1,tile=8x1" -frames:v 1 "logs/preview_${id}_dai.jpg" || true
            cp "output/$id/${id}_dai_youtube.txt" "logs/youtube_${id}.txt" 2>/dev/null || true
            cp "output/$id/${id}_dai_youtube_en.txt" "logs/youtube_en_${id}.txt" 2>/dev/null || true
            cp "output/$id/${id}_dai_review.jpg" "logs/review_${id}_dai.jpg" 2>/dev/null || true
          done < ci_long.txt

      - name: Đưa video ngắn và bài ảnh lên Releases (để duyệt rồi gửi)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s ci_outputs.txt ] || exit 0
          while read -r id || [ -n "$id" ]; do
            [ -z "$id" ] && continue
            [ -f "output/$id/$id.mp4" ] || continue
            tag="video-$id${{ inputs.hau_to }}"
            gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "Video $id" --notes "Video ngắn, bài ảnh, video dài" < /dev/null
            files=$(ls output/$id/$id.mp4 output/$id/${id}_ban_cu.mp4 output/$id/${id}_thumbnail.jpg output/$id/${id}_bia_*.jpg output/$id/${id}_caption.txt output/$id/${id}_post.txt output/$id/${id}_post_*.jpg output/$id/${id}_review.jpg output/$id/${id}_kiemtra_ngan.* 2>/dev/null || true)
            gh release upload "$tag" $files --clobber < /dev/null
          done < ci_outputs.txt

      - name: Đưa video dài lên mục Releases (tải bản 1080p đầy đủ)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s ci_long.txt ] || exit 0
          while read -r id || [ -n "$id" ]; do
            [ -z "$id" ] && continue
            f="output/$id/${id}_dai.mp4"; [ -f "$f" ] || continue
            tag="video-${id}${{ inputs.hau_to }}"
            gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "Video dài $id" --notes "Bản 1080p để đăng YouTube/Facebook" < /dev/null
            extra=$(ls output/$id/${id}_dai_youtube_en.txt output/$id/${id}_dai_*.srt output/$id/${id}.*.srt output/$id/${id}_dai_thumbnail_fb.jpg output/$id/${id}_dai_review.jpg output/$id/${id}_kiemtra_dai.* 2>/dev/null || true)
            gh release upload "$tag" "$f" "output/$id/${id}_dai_thumbnail.jpg" "output/$id/${id}_dai_youtube.txt" $extra --clobber < /dev/null
          done < ci_long.txt

      - name: Gửi video về Telegram (chỉ khi đã duyệt)
        if: always() && inputs.send == 'yes'
        env:
          FORCE_SEND: "no"
          HAU_TO: ${{ inputs.hau_to }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash send_telegram.sh

      - name: Lưu video (tải về trong 7 ngày)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            output/*/*_thumbnail.jpg
            output/*/*_caption.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Ghi nhận video đã dựng
        if: always()
        run: |
          if [ -f logs/last-run.log ]; then
            tail -n 400 logs/last-run.log > logs/tmp && mv logs/tmp logs/last-run.log
          fi
          git add -A logs/
          [ -f rendered.json ] && git add rendered.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -q -m "Cập nhật danh sách video đã dựng"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      # lưu giọng Gemini / ảnh AI kể cả khi lần chạy lỗi, để lần sau không phải đọc/vẽ lại
      - name: Lưu bộ nhớ đệm giọng Gemini và ảnh AI
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            assets/tts_cache
            assets/ai_cache
          key: fv-gen-${{ github.run_id }}
