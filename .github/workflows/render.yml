name: Dựng video

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
  schedule:
    - cron: "17 0 * * *"   # 7h17 sáng VN: thử lại video dài bị hoãn (ví dụ Gemini hết lượt hôm trước)
  workflow_dispatch:
    inputs:
      only:
        description: "Chỉ dựng các mã này (vd: SL1 = cả bộ; SL1:ngan = video ngắn + bài ảnh; SL1:dai = video dài)"
        required: false
        default: ""
      all:
        description: "Dựng lại tất cả"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Phông emoji và ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg > /dev/null

      - name: Bộ nhớ đệm (mô hình giọng, trình duyệt, thư viện)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
            ~/.cache/pip
            .venv-tts
          key: fv-cache-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: fv-cache-v1-

      - name: Bộ nhớ đệm nhạc nền
        uses: actions/cache@v4
        with:
          path: assets/music/cache
          key: fv-music-${{ hashFiles('assets/music/library.json') }}
          restore-keys: fv-music-

      - name: Bộ nhớ đệm giọng Gemini và ảnh AI
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/tts_cache
            assets/ai_cache
          key: fv-gen-${{ github.run_id }}
          restore-keys: fv-gen-

      - name: Cài thư viện dựng video
        run: |
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium > /dev/null

      - name: Cài giọng đọc VieNeu-TTS
        run: |
          if ! .venv-tts/bin/python -c "import sys" 2>/dev/null; then
            rm -rf .venv-tts
            python -m venv .venv-tts
          fi
          .venv-tts/bin/python -m pip install -q --upgrade pip
          .venv-tts/bin/python -m pip install -q vieneu

      - name: Dựng video
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p logs
          if [ "${{ inputs.all }}" = "true" ]; then ARGS="--all"
          elif [ -n "${{ inputs.only }}" ]; then ARGS="--only ${{ inputs.only }}"
          else ARGS=""; fi
          python ci_render.py $ARGS 2>&1 | tee logs/last-run.log

      - name: Ảnh xem nhanh (để kiểm tra)
        if: always()
        run: |
          mkdir -p logs
          rm -f logs/preview_*.jpg
          touch ci_outputs.txt ci_long.txt
          while read -r id || [ -n "$id" ]; do
            [ -z "$id" ] && continue
            f="output/$id/$id.mp4"; [ -f "$f" ] || continue
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" < /dev/null)
            ffmpeg -nostdin -loglevel error -y -i "$f" -vf "fps=6/${dur%.*},scale=270:-1,tile=6x1" -frames:v 1 "logs/preview_${id}.jpg" || true
            cp "output/$id/${id}_caption.txt" "logs/caption_${id}.txt" 2>/dev/null || true
            if [ -f "output/$id/${id}_post_1.jpg" ]; then
              cp "output/$id/${id}_post.txt" "logs/post_${id}.txt" 2>/dev/null || true
              n=$(ls output/$id/${id}_post_*.jpg | wc -l)
              ffmpeg -nostdin -loglevel error -y -i "output/$id/${id}_post_%d.jpg" -vf "scale=324:-1,tile=${n}x1" -frames:v 1 "logs/post_${id}.jpg" || true
            fi
          done < ci_outputs.txt
          [ -s ci_long.txt ] || exit 0
          while read -r id || [ -n "$id" ]; do
            [ -z "$id" ] && continue
            f="output/$id/${id}_dai.mp4"; [ -f "$f" ] || continue
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" < /dev/null)
            ffmpeg -nostdin -loglevel error -y -i "$f" -vf "fps=8/${dur%.*},scale=320:-1,tile=8x1" -frames:v 1 "logs/preview_${id}_dai.jpg" || true
            cp "output/$id/${id}_dai_youtube.txt" "logs/youtube_${id}.txt" 2>/dev/null || true
          done < ci_long.txt

      - name: Đưa video dài lên mục Releases (tải bản 1080p đầy đủ)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s ci_long.txt ] || exit 0
          while read -r id || [ -n "$id" ]; do
            [ -z "$id" ] && continue
            f="output/$id/${id}_dai.mp4"; [ -f "$f" ] || continue
            tag="video-${id}"
            gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "Video dài $id" --notes "Bản 1080p để đăng YouTube/Facebook" < /dev/null
            gh release upload "$tag" "$f" "output/$id/${id}_dai_thumbnail.jpg" "output/$id/${id}_dai_youtube.txt" --clobber < /dev/null
          done < ci_long.txt

      - name: Gửi video về Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_CHAT" ] && [ -f telegram_chat_id.txt ]; then TG_CHAT=$(cat telegram_chat_id.txt); fi
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Chưa cài TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID, bỏ qua bước gửi Telegram."
            exit 0
          fi
          api="https://api.telegram.org/bot${TG_TOKEN}"
          if [ -s ci_outputs.txt ]; then
            while read -r id || [ -n "$id" ]; do
              [ -z "$id" ] && continue
              mp4="output/$id/$id.mp4"
              cap="output/$id/${id}_caption.txt"
              text=$(head -c 950 "$cap" 2>/dev/null || echo "$id")
              curl -s -o /dev/null -w "Gửi $id: %{http_code}\n" \
                -F chat_id="$TG_CHAT" -F supports_streaming=true \
                -F video=@"$mp4" -F caption="$text" "$api/sendVideo"
              # bài đăng ảnh Facebook: album ảnh + bài viết để copy
              if [ -f "output/$id/${id}_post_1.jpg" ]; then
                media="["; args=(); k=0
                for f in $(ls output/$id/${id}_post_*.jpg | sort -V); do
                  [ $k -gt 0 ] && media+=","
                  media+="{\"type\":\"photo\",\"media\":\"attach://p$k\"}"
                  args+=(-F "p$k=@$f"); k=$((k+1))
                done
                media+="]"
                curl -s -o /dev/null -F chat_id="$TG_CHAT" -F text="🖼️ BÀI ĐĂNG ẢNH ($id) — tải các ảnh dưới đây, đăng thành 1 bài nhiều ảnh trên Facebook" "$api/sendMessage"
                curl -s -o /dev/null -w "Ảnh bài đăng $id: %{http_code}\n" -F chat_id="$TG_CHAT" -F media="$media" "${args[@]}" "$api/sendMediaGroup"
                curl -s -o /dev/null -w "Bài viết $id: %{http_code}\n" -F chat_id="$TG_CHAT" \
                  -F text="$(head -c 4000 output/$id/${id}_post.txt)" "$api/sendMessage"
              fi
              if [ -f "output/$id/${id}_thumbnail.jpg" ]; then
                curl -s -o /dev/null -F chat_id="$TG_CHAT" \
                  -F document=@"output/$id/${id}_thumbnail.jpg" -F caption="Ảnh bìa $id" "$api/sendDocument"
              fi
            done < ci_outputs.txt
          fi
          # video dài: bản xem trước nhẹ (giới hạn 50MB của Telegram) + link bản đầy đủ
          if [ -s ci_long.txt ]; then
            while read -r id || [ -n "$id" ]; do
              [ -z "$id" ] && continue
              f="output/$id/${id}_dai.mp4"; [ -f "$f" ] || continue
              dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" < /dev/null)
              vb=$(python3 -c "print(max(300, int(44*8*1024/float('$dur') - 96)))")
              ffmpeg -nostdin -loglevel error -y -i "$f" -vf scale=1280:-2 -c:v libx264 -preset veryfast -b:v ${vb}k \
                -maxrate ${vb}k -bufsize $((vb*2))k -c:a aac -b:a 96k "output/$id/${id}_dai_tg.mp4"
              link="https://github.com/${{ github.repository }}/releases/tag/video-${id}"
              curl -s -o /dev/null -w "Gửi video dài $id: %{http_code}\n" -F chat_id="$TG_CHAT" -F supports_streaming=true \
                -F video=@"output/$id/${id}_dai_tg.mp4" \
                -F caption="🎬 VIDEO DÀI $id (bản xem trước 720p). Bản 1080p để đăng: $link" "$api/sendVideo"
              curl -s -o /dev/null -F chat_id="$TG_CHAT" -F document=@"output/$id/${id}_dai_thumbnail.jpg" \
                -F caption="Ảnh bìa YouTube $id" "$api/sendDocument"
              curl -s -o /dev/null -F chat_id="$TG_CHAT" -F text="$(head -c 4000 output/$id/${id}_dai_youtube.txt)" "$api/sendMessage"
            done < ci_long.txt
          fi
          if [ -s ci_long_failed.txt ]; then
            curl -s -o /dev/null -F chat_id="$TG_CHAT" \
              -F text="⏳ Video dài chưa xong: $(tr '\n' ' ' < ci_long_failed.txt)— có thể Gemini hết lượt hôm nay, máy sẽ tự thử lại sáng mai." "$api/sendMessage"
          fi
          if [ -s ci_failed.txt ]; then
            msg="⚠️ Dựng lỗi: $(tr '\n' ' ' < ci_failed.txt). Xem log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -o /dev/null -F chat_id="$TG_CHAT" -F text="$msg" "$api/sendMessage"
          fi

      - name: Lưu video (tải về trong 7 ngày)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            output/*/*.mp4
            output/*/*_thumbnail.jpg
            output/*/*_caption.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Ghi nhận video đã dựng
        if: always()
        run: |
          if [ -f logs/last-run.log ]; then
            tail -n 400 logs/last-run.log > logs/tmp && mv logs/tmp logs/last-run.log
          fi
          git add -A logs/
          [ -f rendered.json ] && git add rendered.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -q -m "Cập nhật danh sách video đã dựng"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      # lưu giọng Gemini / ảnh AI kể cả khi lần chạy lỗi, để lần sau không phải đọc/vẽ lại
      - name: Lưu bộ nhớ đệm giọng Gemini và ảnh AI
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            assets/tts_cache
            assets/ai_cache
          key: fv-gen-${{ github.run_id }}
