name: Gửi Telegram (sau khi duyệt)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Mã cần gửi, cách nhau dấu phẩy. SL2 = cả bộ; SL2:ngan = video ngắn + bài ảnh; SL2:dai = video dài"
        required: true
      gui_lai:
        description: "Gửi lại dù đã gửi trước đó (yes / no)"
        required: false
        default: "no"
      chi_bai_viet:
        description: "Chỉ gửi bài đăng Facebook (chữ + ảnh), không gửi video (yes / no)"
        required: false
        default: "no"
      chi_bia:
        description: "Chỉ gửi ảnh bìa video dài thiết kế trong assets/bia (yes / no)"
        required: false
        default: "no"
      hau_to:
        description: "Hậu tố tên bản trên Releases (vd: -thu để gửi bản video-TQ45-thu)"
        required: false
        default: ""
      bo_qua_kiem_tra:
        description: "Vẫn gửi cả khi bản tự kiểm tra báo LỖI (yes / no)"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Phông và ffmpeg
        run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Tải kết quả từ Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > ci_outputs.txt; : > ci_long.txt; : > ci_cover.txt
          if [ "${{ inputs.chi_bia }}" = "yes" ]; then
            for item in $(echo "${{ inputs.ids }}" | tr ',' ' '); do
              id="${item%%:*}"; mkdir -p "output/$id"; cp assets/bia/$id/*.jpg "output/$id/" && echo "$id" >> ci_cover.txt
            done
            exit 0
          fi
          for item in $(echo "${{ inputs.ids }}" | tr ',' ' '); do
            id="${item%%:*}"; part="${item#*:}"; [ "$part" = "$item" ] && part="all"
            mkdir -p "output/$id"
            gh release download "video-$id${{ inputs.hau_to }}" --dir "output/$id" --clobber || { echo "Không có Releases cho $id"; continue; }
            if [ "$part" != "dai" ] && [ -f "output/$id/$id.mp4" ]; then echo "$id" >> ci_outputs.txt; fi
            if [ "$part" != "ngan" ] && [ -f "output/$id/${id}_dai.mp4" ]; then echo "$id" >> ci_long.txt; fi
          done
          echo "Video ngắn: $(tr '\n' ' ' < ci_outputs.txt) · video dài: $(tr '\n' ' ' < ci_long.txt)"
      - name: Gửi
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ inputs.bo_qua_kiem_tra }}
          HAU_TO: ${{ inputs.hau_to }}
          GUI_LAI: ${{ inputs.gui_lai }}
          POST_ONLY: ${{ inputs.chi_bai_viet }}
          COVER_ONLY: ${{ inputs.chi_bia }}
        run: bash send_telegram.sh 2>&1 | tee logs/send-run.log
      - name: Ghi sổ đã gửi
        if: always()
        run: |
          git add logs/da_gui.json logs/send-run.log 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git config user.name "fact-video-bot"; git config user.email "actions@users.noreply.github.com"
          git commit -q -m "Sổ video đã gửi Telegram [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done
