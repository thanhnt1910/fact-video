name: Tải tài nguyên MakeHuman (CC0) cho nhân vật 3D

# Chạy khi đẩy video3d/nhan_vat/tai_makehuman.txt. Tải gói makehuman_system_assets (mắt, lông mày,
# lông mi, tóc, da; giấy phép CC0) từ static.makehumancommunity.org, đưa lên Releases (tag video3d-makehuman).
on:
  push:
    branches: [dung-3d-sa-ban]
    paths: ['video3d/nhan_vat/tai_makehuman.txt']

permissions:
  contents: write

jobs:
  tai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Tìm và tải gói
        run: |
          mkdir -p /tmp/mh && cd /tmp/mh
          curl -fsSL --retry 3 https://static.makehumancommunity.org/assets/assetpacks/makehuman_system_assets.html -o trang.html || true
          grep -oiE 'href="[^"]+\.zip"' trang.html | sed 's/href="//I;s/"$//' | sort -u | tee links.txt
          for u in $(cat links.txt); do case "$u" in http*) url="$u";; /*) url="https://static.makehumancommunity.org$u";; *) url="https://static.makehumancommunity.org/assets/assetpacks/$u";; esac
            echo "tải $url"; curl -fsSL --retry 3 -O "$url" || echo "lỗi $url"; done
          for p in $(cat ../../$GITHUB_WORKSPACE/video3d/nhan_vat/tai_makehuman.txt 2>/dev/null | grep -E '^http'); do curl -fsSL --retry 3 -O "$p" || echo "lỗi $p"; done
          ls -la
      - name: Đưa lên Releases
        run: |
          cd /tmp/mh
          for p in $(grep -E '^http' "$GITHUB_WORKSPACE/video3d/nhan_vat/tai_makehuman.txt" || true); do curl -fsSL --retry 3 -O "$p" || echo "lỗi $p"; done
          ls *.zip
          gh release view video3d-makehuman > /dev/null 2>&1 || gh release create video3d-makehuman --target "${{ github.ref_name }}" --prerelease \
            --title "Tài nguyên MakeHuman (CC0)" --notes "Gói makehuman_system_assets từ static.makehumancommunity.org, giấy phép CC0."
          gh release upload video3d-makehuman *.zip trang.html --clobber
