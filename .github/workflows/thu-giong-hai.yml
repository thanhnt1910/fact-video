name: Thử giọng hài Gemini

on:
  push:
    branches: [thu-giong-hai]
    paths: ['ke-hoach/thu-giong-hai/chay.txt']
  workflow_dispatch:
    inputs:
      voices:
        description: "Giọng Gemini, cách nhau dấu phẩy"
        required: false
        default: "Puck,Sadaltager"
      file:
        description: "File kịch bản json"
        required: false
        default: "ke-hoach/thu-giong-hai/habi.json"

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài đặt
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q numpy
      - name: Đọc thử
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          mkdir -p assets/thu_giong_hai
          python thu_giong_hai.py "${{ inputs.file || 'ke-hoach/thu-giong-hai/habi.json' }}" "${{ inputs.voices || 'Puck,Sadaltager' }}" assets/thu_giong_hai 2>&1 | tee logs_thu_giong.txt
      - name: Lưu vào repo
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add assets/thu_giong_hai
          git commit -q -m "Giọng đọc thử kịch bản hài" || exit 0
          git pull --rebase -q || true
          git push -q
