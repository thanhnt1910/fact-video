name: Thử giọng hài Gemini

on:
  push:
    branches: [thu-giong-hai, claude/cach-ho-cai-tri-tap-1]
    paths: ['ke-hoach/thu-giong-hai/chay.txt']
  workflow_dispatch:
    inputs:
      voices:
        description: "Giọng Gemini, cách nhau dấu phẩy"
        required: false
        default: "Puck,Sadaltager"
      file:
        description: "File kịch bản json"
        required: false
        default: "ke-hoach/thu-giong-hai/habi.json"

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/cai-dat
        with:
          pip: "numpy"
      - name: Đọc thử
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI_API_KEY_21 }}
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set -o pipefail
          export GEMINI_SKIP_SUFFIX="$(cat ke-hoach/thu-giong-hai/bo_qua_khoa.txt 2>/dev/null)"
          mkdir -p assets/thu_giong_hai
          export GEMINI_MAX_429=$(cat ke-hoach/thu-giong-hai/max429.txt 2>/dev/null || echo 8)
          export GEMINI_MAX_WAIT=$(cat ke-hoach/thu-giong-hai/max_wait.txt 2>/dev/null || echo 900)
          timeout $(cat ke-hoach/thu-giong-hai/gioi_han.txt 2>/dev/null || echo 9000) python -u thu_giong_hai_cum.py "$([ -n '${{ inputs.file }}' ] && echo '${{ inputs.file }}' || cat ke-hoach/thu-giong-hai/file.txt 2>/dev/null || echo ke-hoach/thu-giong-hai/hs1_full.json)" "${{ inputs.voices || '' }}$(cat ke-hoach/thu-giong-hai/giong.txt 2>/dev/null || echo Puck)" assets/thu_giong_hai $(cat ke-hoach/thu-giong-hai/cum.txt 2>/dev/null || echo 16) 2>&1 | tee logs_thu_giong.txt
      - name: Lưu vào repo
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # Chỉ thêm thư mục giọng vừa đọc (không quét cả assets/thu_giong_hai hàng trăm MB), đẩy thẳng; chỉ kéo về khi đẩy bị từ chối
          VD=assets/thu_giong_hai/$(head -1 ke-hoach/thu-giong-hai/giong.txt 2>/dev/null | tr -d ' \r' | tr 'A-Z' 'a-z' | cut -d, -f1)
          [ -d "$VD" ] || VD=assets/thu_giong_hai
          git add "$VD" logs_thu_giong.txt
          git commit -q -m "Giọng đọc thử kịch bản hài" || exit 0
          git push -q || { git pull --rebase -q && git push -q; }
