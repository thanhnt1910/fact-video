name: Thử giọng so sánh (chương thử)
on:
  push:
    branches: [thu-giong-hai]
    paths: ['ke-hoach/thu-giong-hai/thu_chay.txt']
permissions:
  contents: write
jobs:
  thu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/cai-dat
        with:
          pip: "numpy"
      - name: Đọc ba kiểu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MAX_WAIT: "30"
        run: |
          set -o pipefail
          for v in cu A B; do
            STYLE_VAR=$([ $v = cu ] && echo "" || echo $v) python -u thu_giong_hai_cum.py ke-hoach/thu-giong-hai/thu_langson.json Puck assets/thu_giong_thu/$v 12 2>&1 | tee -a logs_thu_thu.txt || true
          done
      - name: Lưu
        if: always()
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add assets/thu_giong_thu logs_thu_thu.txt
          git commit -q -m "Giọng đọc thử chương Lạng Sơn [skip ci]" || exit 0
          git pull --rebase -q || true
          git push -q
