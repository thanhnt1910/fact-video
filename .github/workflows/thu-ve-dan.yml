name: Thử vẽ dần thủy mặc (30 giây đầu, so cũ và mới)
on:
  workflow_dispatch:
  push:
    branches: [claude/cach-ho-cai-tri-tap-1]
    paths: [ke-hoach/thu-giong-hai/thu_ve_dan.txt]
permissions:
  contents: write
jobs:
  dung:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/cai-dat
        with:
          pip: "playwright numpy opencv-python-headless pillow scipy"
      - run: python -m playwright install --with-deps chromium > /dev/null && which ffprobe
      - uses: actions/cache@v4
        with:
          path: /tmp/gen/bd/a
          key: tai-san-thuy-mac-${{ hashFiles('phim_ban_do/thuymac/assets.html','phim_ban_do/thuymac/assets.py','phim_ban_do/thuymac/mapink*.py','phim_ban_do/world28.py') }}
      - name: Tài sản
        run: |
          M=$(tail -1 ke-hoach/thu-giong-hai/thu_ve_dan.txt | awk '{print $2}')
          echo "M=$M" >> $GITHUB_ENV
          sudo ln -sfn $GITHUB_WORKSPACE /tmp/pc
          mkdir -p /tmp/gen/bd/a /tmp/out && cp -r phim_ban_do/thuymac/* /tmp/gen/bd/ && cp assets/fonts/Lora-Variable.ttf assets/logo/nguoi-gac-su.png /tmp/gen/bd/a/
          mkdir -p /tmp/ne && cp phim_ban_do/world28.py /tmp/ne/ && cd /tmp/ne && B=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
          curl -sSL -o ne_land.json $B/ne_10m_land.geojson; curl -sSL -o ne_lakes.json $B/ne_10m_lakes.geojson; curl -sSL -o ne_rivers.json $B/ne_10m_rivers_lake_centerlines.geojson
          python world28.py > /dev/null; cd /tmp/gen/bd
          [ -f a/map28.png ] || for m in mapink.py mapink_nam.py mapink28.py; do python $m > /dev/null || echo "lỗi $m"; done
          if [ ! -f a/map28.png ] || [ $(ls a | wc -l) -lt 1500 ]; then python assets.py > /dev/null; fi; ls a | wc -l
      - name: Dựng 30 giây cũ và mới
        run: |
          cd /tmp/gen/bd && python amthanh_$M.py
          N=720; H=360
          SIL=1 VE_DAN=1 python dai_$M.py render /tmp/out/s1.mp4 0 $H 24 > /tmp/out/s1.log 2>&1 &
          SIL=1 VE_DAN=1 python dai_$M.py render /tmp/out/s2.mp4 $H $N 24 > /tmp/out/s2.log 2>&1 &
          wait; tail -n 3 /tmp/out/*.log
          printf "file '/tmp/out/s1.mp4'\nfile '/tmp/out/s2.mp4'\n" > /tmp/out/ls.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/out/ls.txt -i /dev/shm/am_$M.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 160k -t 30 /tmp/out/${M}_vedan_s.mp4
          ls -la /tmp/out/*_vedan_*.mp4
      - name: Đẩy lên nhánh thu-ve-dan
        run: |
          mkdir /tmp/v && cd /tmp/v && cp /tmp/out/${M}_vedan_s.mp4 . && cp /tmp/out/*.log . && ls -la
          git init -q && git checkout -q -b thu-ve-dan && git add .
          git -c user.name=fact-video-bot -c user.email=actions@users.noreply.github.com commit -q -m "Thử vẽ dần $M"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" thu-ve-dan
