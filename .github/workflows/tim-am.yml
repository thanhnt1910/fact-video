name: Tìm nhạc nền và tiếng động (PD/CC0)

on:
  workflow_dispatch:
    inputs:
      file:
        description: "File yêu cầu trong ke-hoach/am/ (vd: nhac)"
        required: true
        default: "nhac"

permissions:
  contents: write

jobs:
  tim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tìm
        run: python tim_am.py "ke-hoach/am/${{ inputs.file }}.json"
      - name: Lưu vào repo
        if: always()
        run: |
          git add logs/am_tim || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -q -m "Nhạc/tiếng động ứng viên ${{ inputs.file }} [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
