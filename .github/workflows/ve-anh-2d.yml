name: Vẽ ảnh 2D hàng loạt (Kaggle)

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã chuyện (có ke-hoach/nhan-vat/<mã>_anh.json)"
        required: true
        default: "ST3"
      lam_lai:
        description: "Vẽ lại các ảnh này (số cách nhau dấu phẩy, vd 007,031); để trống = vẽ ảnh chưa có"
        required: false
        default: ""
      dot:
        description: "Đợt vẽ lại (đổi hạt giống): 1, 2, 3…"
        required: false
        default: "1"
      chi_tai:
        description: "1 = không vẽ mới, chỉ tải lại kết quả lần Kaggle trước"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  ve:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow numpy requests kaggle
      - name: Vẽ trên Kaggle
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHI_TAI_LAI: ${{ inputs.chi_tai }}
        run: |
          set -o pipefail
          python ve_anh_2d.py "${{ inputs.ma }}" "${{ inputs.lam_lai }}" "${{ inputs.dot }}" 2>&1 | tee /tmp/ve.txt
      - name: Lưu ảnh vào kho
        if: always()
        run: |
          mkdir -p logs/ve_anh_2d assets/anh_2d
          cp /tmp/ve.txt logs/ve_anh_2d/${{ inputs.ma }}.txt 2>/dev/null || echo "không có /tmp/ve.txt" > logs/ve_anh_2d/${{ inputs.ma }}.txt
          cp logs/kaggle_last.txt logs/ve_anh_2d/${{ inputs.ma }}_kaggle.txt 2>/dev/null || true
          { echo "--- ls ---"; ls assets/anh_2d/${{ inputs.ma }} 2>&1 | wc -l; git status --short | head -5; } >> logs/ve_anh_2d/${{ inputs.ma }}.txt
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f logs/ve_anh_2d
          git add -f assets/anh_2d 2>&1 | tee -a logs/ve_anh_2d/${{ inputs.ma }}.txt || true
          git add -f logs/ve_anh_2d
          git commit -q -m "Vẽ ảnh 2D ${{ inputs.ma }} [skip ci]" || { echo "không có gì để commit"; exit 0; }
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q 2>/tmp/err.txt && git push -q 2>>/tmp/err.txt; then exit 0; fi
            cat /tmp/err.txt >> logs/ve_anh_2d/${{ inputs.ma }}_loi_push.txt; sleep 5
          done
          git rebase --abort 2>/dev/null || true
          git add -f logs/ve_anh_2d; git commit -q -m "loi push" || true
          git push -f origin HEAD:refs/heads/ve-anh-out 2>&1 | tail -5
          exit 1
