name: Vẽ ảnh 2D hàng loạt (Kaggle)

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã chuyện (có ke-hoach/nhan-vat/<mã>_anh.json)"
        required: true
        default: "ST3"
      lam_lai:
        description: "Vẽ lại các ảnh này (số cách nhau dấu phẩy, vd 007,031); để trống = vẽ ảnh chưa có"
        required: false
        default: ""
      dot:
        description: "Đợt vẽ lại (đổi hạt giống): 1, 2, 3…"
        required: false
        default: "1"
      hau_to:
        description: "Vẽ vào thư mục <mã><hậu tố> (vd _KG -> assets/anh_2d/TQ3_KG) để không đè ảnh đã chọn; để trống = ghi vào <mã>"
        required: false
        default: ""
      chi_tai:
        description: "1 = không vẽ mới, chỉ tải lại kết quả lần Kaggle trước"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  ve:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow numpy requests kaggle
      - name: Vẽ trên Kaggle
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHI_TAI_LAI: ${{ inputs.chi_tai }}
          OUT_SUFFIX: ${{ inputs.hau_to }}
        run: |
          set -o pipefail
          python ve_anh_2d.py "${{ inputs.ma }}" "${{ inputs.lam_lai }}" "${{ inputs.dot }}" 2>&1 | tee /tmp/ve.txt
      - name: Lưu ảnh vào kho
        if: always()
        shell: bash
        run: |
          set +e
          M=${{ inputs.ma }}
          mkdir -p logs/ve_anh_2d assets/anh_2d
          cp /tmp/ve.txt logs/ve_anh_2d/$M.txt 2>/dev/null
          cp logs/kaggle_last.txt logs/ve_anh_2d/${M}_kaggle.txt 2>/dev/null
          D=""
          D="$D | anh=$(ls assets/anh_2d/$M${{ inputs.hau_to }} 2>/dev/null | wc -l)"
          D="$D | ve=$(tail -c 600 /tmp/ve.txt 2>/dev/null | tr '\n' ' ')"
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          D="$D | add=$(git add -f logs/ve_anh_2d assets/anh_2d 2>&1 | head -c 300)"
          D="$D | commit=$(git commit -q -m "Vẽ ảnh 2D $M [skip ci]" 2>&1 | head -c 300)"
          for i in 1 2 3; do
            R=$(git pull --rebase --autostash -X theirs -q 2>&1; git push -q 2>&1)
            D="$D | try$i=$(echo $R | head -c 400)"
            if git status -sb | head -1 | grep -qv ahead; then break; fi
            sleep 5
          done
          echo "::notice::$D"
          git status -sb | head -1 | grep -q ahead && exit 1
          exit 0
