name: Vẽ ảnh TQ9 bằng Cloudflare (thử)

on:
  workflow_dispatch:
    inputs:
      so:
        description: "Số ảnh, cách nhau dấu phẩy"
        required: true
        default: "004,028,035,047,059,067,076,086,087,092,104,106,109,121,129,161,171,178"

permissions:
  contents: write

jobs:
  ve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow numpy
      - name: Vẽ
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
        run: python ve_anh_cf.py "${{ inputs.so }}" | tee /tmp/cf.log
      - name: Lưu ảnh
        if: always()
        run: |
          git add assets/anh_2d/TQ9CF || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git commit -q -m "TQ9: ảnh vẽ thử bằng Cloudflare [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
