name: Vẽ ảnh bí ẩn bằng Cloudflare (kênh tiếng Anh)

on:
  push:
    branches: [demo-giong-en]
    paths: ['ke-hoach/roanoke/ve_chay.txt']

permissions:
  contents: write

concurrency:
  group: ve-anh-en

jobs:
  ve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pillow numpy requests
      - name: Vẽ bằng Cloudflare
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
        run: |
          mkdir -p logs
          ARGS=$(tr -d '\r\n' < ke-hoach/roanoke/ve_chay.txt)
          set -o pipefail
          python ve_anh_cf_en.py ke-hoach/roanoke/roanoke.json $ARGS 2>&1 | tee logs/ve_anh_en_run.txt
      - name: Lưu vào repo
        if: always()
        run: |
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/anh_en logs/ve_anh_en.txt || true
          git commit -q -m "Ảnh bí ẩn RN1 vẽ bằng Cloudflare [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
