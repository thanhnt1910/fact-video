name: Thử Veo (ảnh thành video)

on:
  # chỉ chạy khi bấm tay (Actions → Thử Veo → Run workflow): mỗi lần chạy tốn tiền Veo
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã kịch bản (vd: ST1)"
        required: true
        default: "ST1"
      doan:
        description: "Thứ tự tranh AI trong video dài (0 = tranh đầu tiên)"
        required: false
        default: "0"
      giay:
        description: "Độ dài mỗi clip: 4, 6 hoặc 8 giây"
        required: false
        default: "4"
      chuyen_dong:
        description: "Mô tả chuyển động bằng tiếng Anh (để trống = dùng mô tả tranh)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  veo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài đặt
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q google-genai pillow numpy requests
      - name: Lấy tranh AI đã vẽ (bộ nhớ đệm)
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/tts_cache
            assets/ai_cache
          key: fv-gen-${{ github.run_id }}
          restore-keys: fv-gen-
      - name: Tạo clip bằng Veo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
          VEO_ONLY: ngang
          IN_MA: ${{ inputs.ma }}
          IN_DOAN: ${{ inputs.doan }}
          IN_GIAY: ${{ inputs.giay }}
          IN_CD: ${{ inputs.chuyen_dong }}
        run: |
          if [ -n "$IN_MA" ]; then
            python veo_thu.py "scripts/$IN_MA.json" "$IN_DOAN" "$IN_GIAY" "$IN_CD"
          else
            python -c "import json,subprocess,sys; c=json.load(open('veo-thu.json',encoding='utf-8')); sys.exit(subprocess.call([sys.executable,'veo_thu.py','scripts/%s.json'%c['ma'],str(c.get('doan',0)),str(c.get('giay',4)),c.get('chuyen_dong','')]))"
          fi
      - name: Lưu kết quả vào logs/veo
        if: always()
        run: |
          git add logs/veo || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "fact-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -q -m "Thử Veo [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
