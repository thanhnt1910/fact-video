name: Xuất tài sản thủy mặc (assets.html -> PNG)
on:
  workflow_dispatch:
  push:
    branches: [claude/cach-ho-cai-tri-tap-1]
    paths: [ke-hoach/thu-giong-hai/xuat_tai_san.txt]
jobs:
  xuat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q playwright numpy opencv-python-headless pillow && python -m playwright install --with-deps chromium > /dev/null
      - name: Xuất
        run: |
          mkdir -p /tmp/gen/bd/a && cp -r phim_ban_do/thuymac/* /tmp/gen/bd/ && cp assets/fonts/Lora-Variable.ttf /tmp/gen/bd/a/
          sed -i 's#/tmp/pc/#'"$PWD"'/#g' /tmp/gen/bd/mapink*.py
          cd /tmp/gen/bd && for m in mapink.py mapink_nam.py mapink_trung.py mapink21.py; do python $m > /dev/null || echo "lỗi $m"; done
          python assets.py $(cat $GITHUB_WORKSPACE/ke-hoach/thu-giong-hai/xuat_tai_san.txt | tail -n +2)
          ls /tmp/gen/bd/a | wc -l; du -sh /tmp/gen/bd/a
          tar -C /tmp/gen/bd -czf /tmp/a.tgz a
      - uses: actions/upload-artifact@v4
        with:
          name: tai-san-thuy-mac
          path: /tmp/a.tgz
          retention-days: 7
