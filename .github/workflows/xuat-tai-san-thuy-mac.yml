name: Xuất tài sản thủy mặc (assets.html -> PNG)
on:
  workflow_dispatch:
  push:
    branches: [claude/cach-ho-cai-tri-tap-1]
    paths: [ke-hoach/thu-giong-hai/xuat_tai_san.txt]
permissions:
  contents: write
jobs:
  xuat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q playwright numpy opencv-python-headless pillow && python -m playwright install --with-deps chromium > /dev/null
      - name: Xuất
        run: |
          mkdir -p /tmp/gen/bd/a && cp -r phim_ban_do/thuymac/* /tmp/gen/bd/ && cp assets/fonts/Lora-Variable.ttf /tmp/gen/bd/a/
          sed -i 's#/tmp/pc/#'"$PWD"'/#g' /tmp/gen/bd/mapink*.py
          mkdir -p /tmp/ne && cp phim_ban_do/world28.py /tmp/ne/ && cd /tmp/ne && B=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
          curl -sSL -o ne_land.json $B/ne_10m_land.geojson; curl -sSL -o ne_lakes.json $B/ne_10m_lakes.geojson; curl -sSL -o ne_rivers.json $B/ne_10m_rivers_lake_centerlines.geojson
          python world28.py > /dev/null && ls -la world28.jpg; cd $GITHUB_WORKSPACE
          cd /tmp/gen/bd && for m in mapink.py mapink_nam.py mapink_trung.py mapink21.py mapink28.py; do python $m > /dev/null || echo "lỗi $m"; done
          python assets.py $(cat $GITHUB_WORKSPACE/ke-hoach/thu-giong-hai/xuat_tai_san.txt | tail -n +2)
          for c in coN coV; do [ -f /tmp/gen/bd/a/t26_spr_$c.png ] && cp /tmp/gen/bd/a/t26_spr_$c.png /tmp/gen/bd/a/t27_spr_$c.png; done
          ls /tmp/gen/bd/a | wc -l; du -sh /tmp/gen/bd/a
          tar -C /tmp/gen/bd -czf /tmp/a.tgz a
      - name: Đẩy lên nhánh riêng tai-san-thuy-mac (chia phần dưới 90 MB)
        run: |
          mkdir /tmp/ts && cd /tmp/ts && split -b 85m -d /tmp/a.tgz a.tgz.part && ls -la
          git init -q && git checkout -q -b tai-san-thuy-mac && git add . 
          git -c user.name=fact-video-bot -c user.email=actions@users.noreply.github.com commit -q -m "Tài sản thủy mặc $(date +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tai-san-thuy-mac
