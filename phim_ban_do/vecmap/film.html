function tideM(t,it,a){const q=it.pts.map(x=>P(x[0],x[1]));const K=it.lv;let lv=K[K.length-1][1];if(t<=K[0][0])lv=K[0][1];else for(let i=1;i<K.length;i++)if(t<=K[i][0]){lv=lerp(K[i-1][1],K[i][1],ease((t-K[i-1][0])/(K[i][0]-K[i-1][0])));break}

 const sh=cl((t-it.t0-(it.show||0))/1.2)*a;if(sh>0)for(const p of it.stakes){const [x,y]=P(p[0],p[1]),h=FS(34),vis=1-.78*cl((lv-.45)/.3);el('path',{d:`M${x},${y} l0,${-h} M${x-FS(5)},${y-h*.7} l${FS(5)},${-h*.5} l${FS(5)},${h*.5}`,stroke:'#4a3018','stroke-width':FS(5),'stroke-linecap':'round','stroke-linejoin':'round',fill:'none',opacity:sh*vis},dyn)}

function armyM(t,it,a){const n=it.n||14,u=ease(cl((t-it.t0)/(it.dur||3))),col=it.col||COL[it.side],kind=it.u||'inf',bob=t*7;

function T(t){
 const [clon,clat,wd]=cam(t);const [cx,cy]=P(clon,clat);const w=wd*G.k*G.scale,h=w*9/16;SC=1920/w;FS=v=>v/SC;

  else if(it.k=='area'){const p=it.pts.map(x=>P(x[0],x[1]).join(',')).join(' ');el('polygon',{points:p,fill:it.col,opacity:(it.op||.25)*a,stroke:it.col,'stroke-width':2/SC,'stroke-dasharray':`${8/SC} ${6/SC}`},dyn)}

   for(let j=0;j<n;j++){const uu=cl(u*(1+n*.012)-j*.012);if(uu<=0)continue;if(it.stay==false&&u>=1)continue;const [x,y]=polyAt(it.pts,uu);const off=((j*7)%5-2)*FS(5);unit(dyn,x+off,y+((j*3)%4-1.5)*FS(4),col,FS(19),a*(it.stay==false&&u>.9?(1-u)*10:1),0)}
   if(it.flag){const [x,y]=polyAt(it.pts,u);flag(dyn,x,y,col,FS(1)*.8)}}

  else if(it.k=='siege')siege(t,it);

 }
 // ---- HUD ----
 for(const it of SP.items){if(!at(it,t))continue;const a=fade(it,t);
