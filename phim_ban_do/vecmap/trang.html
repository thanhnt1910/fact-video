<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Lora;src:url(../../assets/fonts/Lora-Variable.ttf);font-weight:400 700}
html,body{margin:0;background:#000}svg{display:block}
text{font-family:Lora,serif}
</style>
<script src="geo.js"></script>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
const NS="http://www.w3.org/2000/svg";
let G=null;
function P(lon,lat){return [(lon-G.lon0)*G.k*G.scale,(G.lat1-lat)*G.scale]}
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647}}
const ease=u=>u<0?0:u>1?1:u*u*(3-2*u);
const lerp=(a,b,u)=>a+(b-a)*u;
const CITIES={tl:[105.85,21.03,'Thăng Long','v'],ls:[106.76,21.85,'Lạng Sơn','v'],bt:[106.75,22.12,'','v'],un:[108.37,22.82,'Ung Châu','s'],kc:[108.65,21.96,'Khâm Châu','s'],lc:[109.12,21.66,'Liêm Châu','s']};
// tuyến minh họa (không phải đường đi đã khảo chứng)
const LAND=[[105.85,21.03],[106.3,21.45],[106.76,21.85],[106.75,22.12],[107.5,22.5],[108.37,22.82]];
const SEA=[[107.2,20.95],[107.9,21.2],[108.3,21.55],[108.65,21.96],[109.0,21.8],[109.12,21.66]];
const RED=[[103.9,22.4],[104.5,21.9],[105.2,21.4],[105.85,21.0],[106.3,20.6],[106.6,20.25]];
const NHN=[[105.9,21.35],[106.07,21.19],[106.3,21.1]];
function pathD(ll){const p=ll.map(x=>P(x[0],x[1]));let d=`M${p[0][0]},${p[0][1]}`;
 for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;d+=` Q${a[0]+(b[0]-a[0])*.5+(a[1]-b[1])*.12},${a[1]+(b[1]-a[1])*.5+(b[0]-a[0])*.12} ${b[0]},${b[1]}`}return d}
let svg,world,land,landPath,routes={},tokens={},rings=[],hud;
async function init(){
 G=window.GEO;
 svg=document.getElementById('s');
 const defs=el('defs',{},svg);
 // giấy: nhiễu hạt
 const f=el('filter',{id:'grain',x:0,y:0,width:'100%',height:'100%'},defs);
 el('feTurbulence',{type:'fractalNoise',baseFrequency:'.9',numOctaves:2,seed:3},f);
 el('feColorMatrix',{values:'0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .18  0 0 0 .22 0'},f);
 const sh=el('filter',{id:'sh',x:'-5%',y:'-5%',width:'110%',height:'110%'},defs);
 el('feDropShadow',{dx:0,dy:6,stdDeviation:7,'flood-color':'#3b2f1d','flood-opacity':.35},sh);
 const gl=el('filter',{id:'gl',x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);
 el('feGaussianBlur',{stdDeviation:7},gl);
 const rg=(id,c)=>{const g=el('radialGradient',{id},defs);el('stop',{offset:0,'stop-color':c,'stop-opacity':.55},g);el('stop',{offset:1,'stop-color':c,'stop-opacity':0},g)};
 rg('gv','#c9742a');rg('gs','#3a64a8');
 const cp=el('clipPath',{id:'cl'},defs);el('path',{d:G.land},cp);
 el('rect',{width:G.w,height:G.h,fill:'#a9c4c0'},svg).id='bg';
 world=el('g',{},svg);
 const sea=el('g',{},world);
 el('rect',{width:G.w,height:G.h,fill:'#b7cdc6'},sea);
 const r=rnd(7);
 for(let i=0;i<260;i++){const lon=106.2+r()*4.2,lat=17.8+r()*4.6;const [x,y]=P(lon,lat);
  el('path',{class:'wave',d:`M${x},${y} q10,-7 20,0 t20,0`,fill:'none',stroke:'#fff',opacity:.35,'stroke-width':2,'data-p':r()*6.28},sea)}
 land=el('g',{filter:'url(#sh)'},world);
 landPath=el('path',{d:G.land,fill:'#f1e7cb',stroke:'#7d6a47','stroke-width':3,'stroke-linejoin':'round'},land);
 // vùng ảnh hưởng (làm mờ, cắt theo đất liền)
 const reg=el('g',{'clip-path':'url(#cl)'},world);
 const [vx,vy]=P(105.6,21.6),[sx,sy]=P(108.4,23.6);
 el('ellipse',{cx:vx,cy:vy,rx:380,ry:300,fill:'url(#gv)'},reg);
 el('ellipse',{cx:sx,cy:sy,rx:560,ry:360,fill:'url(#gs)'},reg);
 // núi
 const m=el('g',{'clip-path':'url(#cl)',opacity:.75},world);const r2=rnd(11);
 for(let i=0;i<150;i++){const lon=103.2+r2()*3.4,lat=21.4+r2()*2.4; if(lon>106 && lat<22.1)continue;
  const [x,y]=P(lon,lat),h=22+r2()*20;el('path',{d:`M${x-h*.8},${y} L${x},${y-h} L${x+h*.8},${y} M${x},${y-h} L${x+h*.25},${y-h*.4}`,fill:'none',stroke:'#8a7650','stroke-width':2.2,'stroke-linecap':'round'},m)}
 for(let i=0;i<110;i++){const lon=106.2+r2()*3.0,lat=22.9+r2()*1.8;
  const [x,y]=P(lon,lat),h=20+r2()*18;el('path',{d:`M${x-h*.8},${y} L${x},${y-h} L${x+h*.8},${y}`,fill:'none',stroke:'#8a7650','stroke-width':2.2,'stroke-linecap':'round'},m)}
 // sông
 for(const [nm,ll,w] of [['red',RED,7],['nhn',NHN,5]]){el('path',{d:pathD(ll),fill:'none',stroke:'#7fa7c4','stroke-width':w,'stroke-linecap':'round',opacity:.95},world)}
 // nhãn vùng
 const [lx,ly]=P(104.2,21.3),[tx,ty]=P(108.9,23.7);
 for(const [x,y,t,c] of [[lx,ly,'ĐẠI VIỆT','#8a4a14'],[tx,ty,'TỐNG','#27487f']])
  el('text',{x,y,'text-anchor':'middle','font-size':74,'font-weight':700,'letter-spacing':14,fill:c,opacity:.55},world).textContent=t;
 // tuyến
 for(const [k,ll,c] of [['land',LAND,'#b4521a'],['sea',SEA,'#1f5f8b']]){
  const g=el('g',{},world);
  el('path',{d:pathD(ll),fill:'none',stroke:'#3b2f1d','stroke-width':4,'stroke-dasharray':'2 14','stroke-linecap':'round',opacity:.35},g);
  const glow=el('path',{d:pathD(ll),fill:'none',stroke:c,'stroke-width':16,'stroke-linecap':'round',filter:'url(#gl)',opacity:.7},g);
  const line=el('path',{d:pathD(ll),fill:'none',stroke:c,'stroke-width':7,'stroke-linecap':'round'},g);
  routes[k]={glow,line,len:line.getTotalLength()};
  const t=el('g',{},g);el('circle',{r:20,fill:c,opacity:.35,filter:'url(#gl)'},t);
  el('path',{d:'M0,-26 L0,10 M0,-26 L22,-18 L0,-10',fill:c,stroke:'#2b2218','stroke-width':3,'stroke-linejoin':'round'},t);
  el('circle',{r:7,cy:12,fill:'#2b2218'},t);tokens[k]=t}
 // thành
 for(const k in CITIES){const [lo,la,nm,side]=CITIES[k];const [x,y]=P(lo,la);const g=el('g',{transform:`translate(${x},${y})`},world);
  const c=side=='v'?'#8a4a14':'#27487f';
  const ring=el('circle',{r:10,fill:'none',stroke:c,'stroke-width':3,opacity:0},g);rings.push({k,ring,x,y});
  if(nm){el('rect',{x:-9,y:-9,width:18,height:18,fill:'#f7efd8',stroke:c,'stroke-width':4},g);
   const t=el('text',{x:0,y:-22,'text-anchor':'middle','font-size':34,'font-weight':600,fill:'#2b2218','paint-order':'stroke',stroke:'#f1e7cb','stroke-width':7},g);t.textContent=nm}}
 // phủ giấy + tối góc
 hud=el('g',{},svg);
}
const CAM=[[0,106.6,21.8,8.6],[3.6,107.3,22.0,7.6],[6.6,108.3,22.3,4.8],[10,108.4,22.4,4.4]];
function cam(t){let i=0;while(i<CAM.length-2&&t>CAM[i+1][0])i++;const a=CAM[i],b=CAM[i+1];const u=ease((t-a[0])/(b[0]-a[0]));
 return [lerp(a[1],b[1],u),lerp(a[2],b[2],u),lerp(a[3],b[3],u)]}
function T(t){
 const [clon,clat,wd]=cam(t);const [cx,cy]=P(clon,clat);const w=wd*G.k*G.scale,h=w*9/16;
 world.setAttribute('transform',`scale(${1920/w}) translate(${-(cx-w/2)},${-(cy-h/2)})`);
 // sóng
 document.querySelectorAll('.wave').forEach(e=>{e.setAttribute('transform',`translate(${Math.sin(t*1.6+ +e.dataset.p)*10},0)`);e.setAttribute('opacity',.25+.2*Math.sin(t*2+ +e.dataset.p))});
 // tuyến: đất liền 1.2→5.8, biển 1.6→5.0
 for(const [k,t0,t1] of [['land',1.2,6.0],['sea',1.6,5.0]]){
  const r=routes[k],u=ease((t-t0)/(t1-t0));const L=r.len*u;
  for(const e of [r.glow,r.line]){e.setAttribute('stroke-dasharray',`${L} ${r.len}`)}
  const p=r.line.getPointAtLength(Math.max(.01,L));const tk=tokens[k];
  tk.setAttribute('transform',`translate(${p.x},${p.y}) scale(${(1920/w>1?1:1)*1.0})`);tk.setAttribute('opacity',u>0&&u<1?1:(u>=1?.0:0));
  tk.querySelector('circle').setAttribute('r',20+3*Math.sin(t*9))}
 // nhịp thành + sóng xung khi quân tới
 const hits={kc:4.2,lc:5.0,un:6.0};
 for(const r of rings){const t0=hits[r.k];if(t0==null)continue;const u=(t-t0)/1.6;
  if(u>0&&u<1){r.ring.setAttribute('r',10+150*u);r.ring.setAttribute('opacity',(1-u)*.9);r.ring.setAttribute('stroke','#b3261e');r.ring.setAttribute('stroke-width',6*(1-u)+1)}else r.ring.setAttribute('opacity',0)}
 // HUD: chip năm + tối góc + hạt giấy
 hud.innerHTML='';
 const a=ease((t-0.2)/0.8);
 el('rect',{width:1920,height:1080,filter:'url(#grain)',opacity:.9},hud);
 const vg=el('radialGradient',{id:'vg',cx:.5,cy:.5,r:.75},hud);el('stop',{offset:.55,'stop-color':'#000','stop-opacity':0},vg);el('stop',{offset:1,'stop-color':'#1b1409','stop-opacity':.55},vg);
 el('rect',{width:1920,height:1080,fill:'url(#vg)'},hud);
 const g=el('g',{opacity:a,transform:`translate(70,${1000+(1-a)*30})`},hud);
 el('rect',{x:-24,y:-70,width:390,height:96,rx:10,fill:'#241a0e',opacity:.82},g);
 el('text',{x:0,y:-6,'font-size':58,'font-weight':700,fill:'#f1e7cb'},g).textContent='Năm 1075';
}
window.T=T;window.ready=init().then(()=>{T(0);return true});
</script>
